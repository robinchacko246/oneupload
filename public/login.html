<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a12" />
  <title>Login · One Upload</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg"><span></span><span></span><span></span></div>

  <div class="login-wrap">
    <form class="card login-card" id="loginForm" autocomplete="on">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </div>
      <h1>One <span class="grad-text">Upload</span></h1>
      <p class="sub">ഒരു തവണ അപ്‌ലോഡ് ചെയ്യൂ, എല്ലായിടത്തും പോസ്റ്റ് ആവും</p>

      <div class="login-icons">
        <div class="pi yt"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 7.8v8.4L16.5 12z"/></svg></div>
        <div class="pi ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.9" cy="7.1" r="1" fill="currentColor" stroke="none"/></svg></div>
        <div class="pi fb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.4 20v-7h2.4l.4-2.8h-2.8V8.4c0-.8.2-1.4 1.4-1.4h1.5V4.5c-.3 0-1.1-.1-2.1-.1-2.1 0-3.5 1.3-3.5 3.6v2.1H8.3V13h2.4v7z"/></svg></div>
      </div>

      <div class="segmented auth-tabs" role="tablist">
        <label><input type="radio" name="authMode" value="login" checked /><span>Login</span></label>
        <label><input type="radio" name="authMode" value="register" /><span>Create account</span></label>
      </div>

      <div class="auth-fields">
        <input class="text" id="name" name="name" placeholder="Your name" autocomplete="name" hidden />
        <input class="text" id="email" name="email" type="email" placeholder="Email" autocomplete="email" required autofocus />
        <div class="pw">
          <input class="text" id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="button" id="toggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <input class="text" id="invite" name="invite" type="password" placeholder="Invite code" autocomplete="off" hidden />
      </div>
      <p class="hint" id="hint" hidden></p>
      <button class="btn-primary" type="submit" id="go">Login</button>
      <p class="login-err" id="err" role="alert"></p>
      <p class="foot">One Upload · YouTube · Instagram · Facebook</p>
    </form>
  </div>

  <script src="/login.js" type="module"></script>
</body>
</html>
